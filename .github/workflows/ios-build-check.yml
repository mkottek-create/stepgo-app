name: StepGo City - iOS Build-Check

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ios-build-check.yml"
      - "native-ios/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - "app.js"
      - "index.html"

permissions:
  contents: read

jobs:
  iphone-build-check:
    name: iPhone-App schrittweise pruefen und kompilieren
    runs-on: macos-26-intel
    timeout-minutes: 28
    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Node.js vorbereiten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Xcode und Swift anzeigen
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks

      - name: Capacitor installieren
        run: npm install --no-audit --no-fund

      - name: iPhone-Projekt erzeugen
        run: npm run ios:init

      - name: Xcode-Projekt-Werkzeuge installieren (ohne Systemrechte)
        run: |
          gem install --user-install xcodeproj --no-document
          ruby -e 'require "xcodeproj"; require "rexml/document"; puts "Ruby und Xcodeproj bereit."'

      - name: HealthKit integrieren
        run: ruby scripts/configure-native-ios.rb

      - name: Schritt 1 - Swift-Syntax und Xcode-Dateien pruefen
        shell: bash
        run: |
          set -euxo pipefail
          swiftc -frontend -parse ios/App/App/StepGoHealthPlugin.swift ios/App/App/StepGoBridgeViewController.swift
          plutil -lint ios/App/App/Info.plist ios/App/App/StepGoCity.entitlements
          xmllint --noout ios/App/App/Base.lproj/Main.storyboard
          grep -q 'NSHealthShareUsageDescription' ios/App/App/Info.plist
          echo "Swift-Syntax, HealthKit-Info und Storyboard geprueft"

      - name: Schritt 2 - Swift-Pakete aufloesen (maximal 7 Minuten)
        shell: bash
        run: |
          python3 scripts/run_xcode_stage.py resolve 420 \
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/stepgo-packages" \
              -resolvePackageDependencies

      - name: Schritt 3 - iOS Simulator kompilieren (maximal 13 Minuten)
        shell: bash
        run: |
          python3 scripts/run_xcode_stage.py compile 780 \
            xcodebuild \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/stepgo-packages" \
              -derivedDataPath "$RUNNER_TEMP/stepgo-derived" \
              -disableAutomaticPackageResolution \
              -jobs 2 \
              COMPILER_INDEX_STORE_ENABLE=NO \
              CODE_SIGNING_ALLOWED=NO \
              build

      - name: Schritt 4 - Testinstallation und Start im iPhone-Simulator
        shell: bash
        run: |
          python3 scripts/run_xcode_stage.py simulator 360 \
            bash scripts/test-simulator.sh

      - name: Diagnose und Screenshot sichern (auch bei Fehler)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StepGo-City-iOS-Testinstallation
          path: |
            ${{ runner.temp }}/stepgo-ios-resolve.log
            ${{ runner.temp }}/stepgo-ios-compile.log
            ${{ runner.temp }}/stepgo-ios-simulator.log
            ${{ runner.temp }}/stepgo-city-simulator.png
          if-no-files-found: warn
          retention-days: 14
